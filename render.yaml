services:
  - type: web
    name: property-intelligence-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r backend/requirements-render.txt &&
      cd backend &&
      python scripts/seed_database.py &&
      test -f ../models/rag_index.pkl &&
      test -f ../models/intent_model.joblib &&
      test -f ../models/conversion_model.joblib
    startCommand: >-
      cd backend &&
      python -c "from app.db.session import SessionLocal; from app.db.models import Applicant, Property; from sqlalchemy import func, select; db=SessionLocal(); empty=(db.scalar(select(func.count()).select_from(Applicant)) or 0)==0 or (db.scalar(select(func.count()).select_from(Property)) or 0)==0; db.close(); raise SystemExit(1 if empty else 0)" || python scripts/seed_database.py;
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./property_intelligence.db
      - key: CORS_ORIGINS
        value: https://property-intelligence-pearl.vercel.app
      - key: ENVIRONMENT
        value: render-free-demo
      - key: MODEL_DIR
        value: ../models
      - key: DATA_DIR
        value: ../data/processed
      - key: RAG_EMBEDDING_MODE
        value: lexical
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: EMBEDDING_BATCH_SIZE
        value: 16
      - key: LLM_PROVIDER
        value: fallback
      - key: RATE_LIMIT_PER_MINUTE
        value: 120
